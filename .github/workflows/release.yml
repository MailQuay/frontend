name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: package
        run: |
          (cd dist && zip -qr "../frontend-dist-${GITHUB_REF_NAME}.zip" .)
          sha256sum "frontend-dist-${GITHUB_REF_NAME}.zip" > "frontend-dist-${GITHUB_REF_NAME}.zip.sha256"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "frontend-dist-${GITHUB_REF_NAME}.zip" "frontend-dist-${GITHUB_REF_NAME}.zip.sha256" --clobber
